name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full dependency audit report
        run: npm audit --json > npm-audit-report.json || true
      - name: Publish generated lockfile and full audit report for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-review-${{ github.run_id }}
          path: |
            package-lock.json
            npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Full Git history secret scan
        shell: bash
        run: |
          GITLEAKS_BIN="$(command -v gitleaks || find /tmp -type f -name gitleaks -perm -111 -print -quit)"
          test -n "$GITLEAKS_BIN"
          "$GITLEAKS_BIN" detect --source . --log-opts="--all" --redact --exit-code=2
      - name: Repository secret hygiene
        run: node scripts/security-check.mjs
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder
        run: npm run build
      - name: Client bundle secret exposure check
        run: node scripts/client-bundle-security-check.mjs
