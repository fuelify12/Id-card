name: Phase 22 spreadsheet import checks

on:
  push:
    branches:
      - phase-22-school-import-mapping
  pull_request:
    branches:
      - phase-20-isolated-acceptance
    paths:
      - "app/dashboard/**"
      - "components/projects/student-import-workspace.tsx"
      - "lib/import/**"
      - "lib/imports/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/phase22-import.yml"

permissions:
  contents: read

concurrency:
  group: phase22-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, TypeScript, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test, typecheck, lint, and build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
