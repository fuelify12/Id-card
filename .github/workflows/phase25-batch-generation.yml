name: Phase 25 batch integrity and full regression

on:
  push:
    branches:
      - phase-25-batch-generation-acceptance
      - phase-26-blocker-resolution
      - phase-27-visual-print-acceptance
      - phase-28-authoritative-schema-recovery
  pull_request:
    branches:
      - phase-24-canonical-student-identifiers
      - phase-25-batch-generation-acceptance
      - phase-26-blocker-resolution
      - phase-27-visual-print-acceptance
      - phase-28-authoritative-schema-recovery
    paths:
      - "app/api/projects/**"
      - "components/auth/**"
      - "components/projects/create-project-form.tsx"
      - "postcss.config.mjs"
      - "lib/batch/**"
      - "lib/exports/**"
      - "lib/identifiers/**"
      - "lib/photos/**"
      - "lib/rendering/**"
      - "lib/validation/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/**"
      - "docs/phase25-batch-generation-acceptance.md"
      - "docs/phase26-blocker-resolution.md"
      - "docs/phase27-visual-print-acceptance.md"
      - "docs/phase28-migration-recovery.md"
      - "scripts/phase28-migration-contract-check.mjs"
      - "supabase/recovery/**"
      - ".github/workflows/phase25-batch-generation.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

permissions:
  contents: read

concurrency:
  group: phase25-batch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full regression, artifact integrity, types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Repository security checks
        run: node scripts/security-check.mjs
      - name: Phase 28 migration contract check
        run: node scripts/phase28-migration-contract-check.mjs --allow-recovery-snapshot
      - name: Full regression tests
        env:
          PRINTFORGE_VISUAL_ARTIFACT_DIR: artifacts/phase27-visual-print
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder
        run: npm run build
      - name: Client bundle secret exposure check
        run: node scripts/client-bundle-security-check.mjs
      - name: Upload synthetic visual and print artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase27-visual-print-${{ github.sha }}
          path: artifacts/phase27-visual-print/
          if-no-files-found: warn
          retention-days: 7
